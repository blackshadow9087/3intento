```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Editar misión</title>
</head>
<body>

    <h1>Editar misión</h1>

    <div id="botones">
        <button type="button" onclick="location.href='/'">
            Volver
        </button>
  

        <button type="button" onclick="location.href='/cerrar-sesion'">
            Cerrar sesión
        </button>
    </div>

    <form action="/editar    id=edicion; " method="post">

        <label for="destino">Nombre:</label>
        <input
            type="text"
            name="destino"
            id="destino"
            value="{{ edicion.destino }}"
            maxlength="120"
            required
        >
        <br><br>

        <label for="fecha_inicio">Fecha de inicio:</label>
        <input
            type="date"
            name="fecha_inicio"
            id="fecha_inicio"
            value="{{ edicion.fecha_inicio }}"
            required
        >
        <br><br>

        <label for="fecha_fin">Fecha de fin:</label>
        <input
            type="date"
            name="fecha_fin"
            id="fecha_fin"
            value="{{ edicion.fecha_fin }}"
            required
        >
        <br><br>

        <label for="descripcion">Descripción:</label>
        <textarea
            name="descripcion"
            id="descripcion"
            required
        >{{ edicion.descripcion }}</textarea>
        <br><br>

        <input type="submit" value="Actualizar viaje">

    </form>

</body>
</html>
