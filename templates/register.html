
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Registro e inicio de sesión</title>
</head>

<body>


    <div class="registro">
        <main class="contenedor">
        <!-- FORMULARIO DE REGISTRO -->
        <section class="registro">
            <h1>Crear cuenta</h1>

            <form action="{{ url_for('registro') }}" method="POST">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>

                <label for="correo-registro">Correo electrónico:</label>
                <input type="email" id="correo-registro"
                       name="correo" required>

                <label for="password-registro">Contraseña:</label>
                <input type="password" id="password-registro"
                       name="password" minlength="8" required>

                <label for="confirmar-password">Confirmar contraseña:</label>
                <input type="password" id="confirmar-password"
                       name="confirmar_password" minlength="8" required>

                <button type="submit">Registrarme</button>

                <p>
                    ¿Ya tienes cuenta?
                    <a href="{{ url_for('iniciar_sesion.html') }}">Inicia sesión</a>
                </p>

            </form>
    </main>

    </div>
   
</body>
</html>
