
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <title>Registro e inicio de sesión</title>
</head>

<body>

    <main class="contenedor">

        <!-- FORMULARIO DE REGISTRO -->
        <section class="registro">
            <h1>Crear cuenta</h1>

            <form action="{{ url_for('registro') }}" method="POST">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>

                <label for="correo-registro">Correo electrónico:</label>
                <input type="email" id="correo-registro"
                       name="correo" required>

                <label for="password-registro">Contraseña:</label>
                <input type="password" id="password-registro"
                       name="password" minlength="8" required>

                <label for="confirmar-password">Confirmar contraseña:</label>
                <input type="password" id="confirmar-password"
                       name="confirmar_password" minlength="8" required>

                <button type="submit">Registrarme</button>

                <p>
                    ¿Ya tienes cuenta?
                    <a href="{{ url_for('index') }}">Inicia sesión</a>
                </p>

            </form>
        </section>



        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <section class="login">
            <h1>Iniciar sesión</h1>

            <form action="{{ url_for('index') }}" method="POST">

                <label for="correo-login">Correo electrónico:</label>
                <input type="email" id="correo-login"
                       name="correo" required>

                <label for="password-login">Contraseña:</label>
                <input type="password" id="password-login"
                       name="password" required>

                <button type="submit">Iniciar sesión</button>

                <p>
                    ¿No tienes cuenta?
                    <a href="{{ url_for('registro') }}">Regístrate aquí</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
